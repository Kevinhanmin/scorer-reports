.report-card:hover {

    border: none; border-radius: 8px; font-size: 13px; font-weight: 500;

.report-card .btn-view:hover { background: #e2e8f0; color: #1e293b; }

function buildCard(r) {
    const cls = r.type === 'L1免费体检' ? 'l1' : 'l2';
    const badge = r.type === 'L1免费体检'
        ? '<span class="badge l1">🏭 免费体检</span>'
        : '<span class="badge l2">💎 深度诊断</span>';
    const isUnk = !r.company || r.company === 'unknown';
    const cname = isUnk ? '未识别企业' : r.company;
    const ccls = isUnk ? 'company unknown' : 'company';
    return `<div class="report-card ${cls}">
        ${badge}
        <div class="info">
            <div class="${ccls}">${cname}</div>
            <div class="date">📅 ${r.dateOnly}</div>
        </div>
        <a class="btn-view" href="${r.file}" target="_blank">📄 查看</a>
    </div>`;
}

function render() {
    const activeTab = document.querySelector('.tab-btn.active');
    const tab = activeTab ? activeTab.getAttribute('data-tab') : 'all';
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const sort = document.getElementById('sortSelect').value;

    let filtered = DATA.filter(r => {
        if (tab === 'l1' && r.type !== 'L1免费体检') return false;
        if (tab === 'l2' && r.type !== 'L2深度诊断') return false;
        if (q && !(r.company || '').toLowerCase().includes(q)) return false;
        return true;
    });

    // Dedup: keep latest per (type, companyKey, dateOnly)
    const seen = new Set();
    const unique = [];
    for (const r of filtered) {
        const key = r.type + '|' + (r.companyKey || r.company) + '|' + r.dateOnly;
        if (!seen.has(key)) { seen.add(key); unique.push(r); }
    }

    if (sort === 'date-desc') unique.sort((a,b) => b.timestamp.localeCompare(a.timestamp));
    else if (sort === 'date-asc') unique.sort((a,b) => a.timestamp.localeCompare(b.timestamp));
    else if (sort === 'name') unique.sort((a,b) => (a.company||'').localeCompare(b.company||''));

    const el = document.getElementById('reportList');
    if (unique.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>没有匹配的报告</p></div>';
        return;
    }

    if (tab === 'all' && !q) {
        // Group by date
        const groups = {};
        for (const r of unique) {
            if (!groups[r.dateOnly]) groups[r.dateOnly] = [];
            groups[r.dateOnly].push(r);
        }
        const dates = Object.keys(groups).sort((a,b) => b.localeCompare(a));
        let html = '';
        for (const d of dates) {
            html += `<div class="report-group"><h2>📅 ${d} <span class="count">${groups[d].length} 份</span></h2>`;
            for (const r of groups[d]) html += buildCard(r);
            html += '</div>';
        }
        el.innerHTML = html;
    } else {
        el.innerHTML = unique.map(buildCard).join('');
    }
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });
});

render();
