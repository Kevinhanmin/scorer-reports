<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思派工业 · 诊断报告查询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f7fa; min-height: 100vh; color: #333;
}
.header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: white; padding: 40px 20px 30px; text-align: center;
}
.header h1 { font-size: 22px; margin-bottom: 8px; }
.header p { font-size: 14px; opacity: 0.85; }
.container { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
.search-box {
    background: white; border-radius: 12px; padding: 24px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
}
.search-box label { 
    display: block; font-size: 14px; font-weight: 600; 
    color: #555; margin-bottom: 8px;
}
.search-box input {
    width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0;
    border-radius: 8px; font-size: 16px; transition: border-color 0.2s;
    outline: none;
}
.search-box input:focus { border-color: #2563eb; }
.search-box .hint {
    font-size: 12px; color: #94a3b8; margin-top: 6px;
}
.btn-search {
    width: 100%; padding: 14px; background: #2563eb; color: white;
    border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 12px; transition: background 0.2s;
}
.btn-search:hover { background: #1d4ed8; }
.btn-search:disabled { background: #94a3b8; cursor: not-allowed; }

.result-area { display: none; }
.result-area.visible { display: block; }

.report-card {
    background: white; border-radius: 12px; padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
    border-left: 4px solid #2563eb;
}
.report-card.l1 { border-left-color: #10b981; }
.report-card.l2 { border-left-color: #2563eb; }
.report-card .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; margin-bottom: 8px;
}
.report-card .badge.l1 { background: #d1fae5; color: #065f46; }
.report-card .badge.l2 { background: #dbeafe; color: #1e40af; }
.report-card h3 { font-size: 16px; margin-bottom: 4px; }
.report-card .meta { font-size: 13px; color: #64748b; margin-bottom: 8px; }
.report-card .rating {
    font-size: 14px; font-weight: 600; padding: 4px 0;
}
.rating-a { color: #059669; } .rating-b { color: #2563eb; }
.rating-c { color: #d97706; } .rating-d { color: #dc2626; }
.report-card .btn-view {
    display: inline-block; padding: 8px 20px; background: #f1f5f9;
    color: #333; border-radius: 6px; text-decoration: none;
    font-size: 13px; font-weight: 500; margin-top: 8px;
    transition: background 0.2s;
}
.report-card .btn-view:hover { background: #e2e8f0; }
.report-card .btn-view.hidden { display: none; }
.no-result { 
    text-align: center; padding: 40px 20px; color: #94a3b8;
}
.no-result .icon { font-size: 48px; margin-bottom: 12px; }
.no-result p { font-size: 14px; }
.footer {
    text-align: center; padding: 20px 16px; color: #94a3b8; font-size: 12px;
}
.footer a { color: #2563eb; text-decoration: none; }
.footer .contact-info {
    background: white; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
    max-width: 360px; margin-left: auto; margin-right: auto;
}
.footer .contact-info h4 { 
    font-size: 15px; color: #333; margin-bottom: 12px; font-weight: 600;
}
.footer .contact-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid #f1f5f9; text-align: left;
}
.footer .contact-item:last-child { border-bottom: none; }
.footer .contact-item .icon { font-size: 20px; flex-shrink: 0; }
.footer .contact-item .label { font-size: 12px; color: #94a3b8; }
.footer .contact-item .value { font-size: 14px; color: #2563eb; font-weight: 500; word-break: break-all; }
.footer .contact-item a { color: #2563eb; text-decoration: none; }
.footer .contact-item a:hover { text-decoration: underline; }
.footer .copyright { margin-top: 16px; font-size: 11px; color: #cbd5e1; }
.loading { text-align: center; padding: 20px; color: #94a3b8; }
</style>
</head>
<body>

    <p>思派工业 · 精益智能工厂诊断系统</p>
</div>

<div class="container">
    <div class="search-box">
        <label>📱 输入手机号查询报告</label>
        <input type="tel" id="phoneInput" placeholder="请输入填写问卷时留的手机号" maxlength="11" />
        <div class="hint">仅支持查询您自己公司的诊断报告</div>
        <button class="btn-search" id="searchBtn" onclick="searchReport()">🔍 查询报告</button>
    </div>

    <div class="result-area" id="resultArea">
        <div id="resultContent"></div>
    </div>

    <div class="footer">
        <div class="contact-info">
            <h4>📞 联系我们</h4>
            <div class="contact-item">
                <span class="icon">📧</span>
                <div>
                    <div class="label">邮箱</div>
                    <a class="value" href="mailto:sptechsz@163.com">发送邮件</a>
                </div>
            </div>
                <div class="contact-item" style="flex-direction:column;align-items:center;gap:8px">
                <div class="label">微信</div>
                <img src="../contact_wechat.jpg" alt="扫码添加微信" style="width:180px;height:auto;border-radius:8px;border:1px solid #eef2f6" />
                <div style="font-size:12px;color:#94a3b8">长按或扫码添加好友</div>
            </div>
        </div>
        <div class="copyright">

            <p style="margin-top:2px;font-size:10px"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none">粤ICP备2026063069号-1</a></p>
            <p style="margin-top:2px;font-size:10px"><a href="../service-terms.html" style="color:#94a3b8;text-decoration:underline">服务条款 · 售后保障 · 退款政策</a></p>
            <p style="margin-top:4px">© 2026 思派工业 · 精益智能工厂领航员</p>

    </div>
</div>

    "report_date": "2026-05-11"
  }
];

// 手机号映射表（由更新脚本自动编译，经脱敏处理）
const PHONE_MAP = {
  "p_MTgwMzgwMjU1ODI": [
    "rec27qzwynurH7",
    "rec27r1OzR2GBZ",
    "rec27nnMwzQb3M",
    "rec27nnNGLhYyd",
    "rec27nobUb8cC8",
    "rec27nptzLAlXN"
  ]
};

function hashPhone(phone) {
    return 'p_' + btoa(phone).replace(/=/g, '').substring(0, 16);
}

function searchReport() {
    const phone = document.getElementById('phoneInput').value.trim();
    const resultArea = document.getElementById('resultArea');
    const resultContent = document.getElementById('resultContent');
    
    if (!phone || phone.length < 11) {
        resultArea.classList.add('visible');
        resultContent.innerHTML = '<div class="no-result"><div class="icon">📱</div><p>请输入完整的11位手机号</p></div>';
        return;
    }
    
    const phoneHash = hashPhone(phone);
    
    // 方式1：从PHONE_MAP快速查找匹配的记录ID
    const matchedIds = PHONE_MAP[phoneHash] || [];
    
    // 方式2：也检查REPORTS中的phones数组（兼容空映射时回退）
    if (matchedIds.length === 0) {
        // 通过REPORTS逐个检查
        const matched = REPORTS.filter(r => {
            return r.phones && r.phones.some(p => hashPhone(p) === phoneHash);
        });
        
        if (matched.length === 0) {
            resultArea.classList.add('visible');
            resultContent.innerHTML = '<div class="no-result"><div class="icon">🔍</div><p>未找到与该手机号匹配的报告</p><p style="font-size:12px;margin-top:8px">请确认输入的是填问卷时留的手机号</p><p style="font-size:12px;margin-top:4px">如仍未查到，请联系思派工业客服</p></div>';
            return;
        }
        
        resultArea.classList.add('visible');
        renderReports(matched, resultContent);
        return;
    }
    
    // 通过ID查找完整报告信息
    const idMap = {};
    REPORTS.forEach(r => { idMap[r.record_id] = r; });
    const matched = matchedIds.map(id => idMap[id]).filter(Boolean);
    
    if (matched.length === 0) {
        resultArea.classList.add('visible');
        resultContent.innerHTML = '<div class="no-result"><div class="icon">🔍</div><p>未找到与该手机号匹配的报告</p><p style="font-size:12px;margin-top:8px">请联系思派工业客服获取帮助</p></div>';
        return;
    }
    
    resultArea.classList.add('visible');
    renderReports(matched, resultContent);
}

function renderReports(matched, container) {
    container.innerHTML = '<div style="margin-bottom:16px;font-size:14px;color:#64748b">找到 <strong>' + matched.length + '</strong> 份报告</div>';
    
    matched.sort((a, b) => b.report_date.localeCompare(a.report_date));
    
    matched.forEach(r => {
        const typeClass = r.type === 'l1' ? 'l1' : 'l2';
        const typeLabel = r.type === 'l1' ? '🏭 免费体检报告' : '💎 深度诊断报告';
        
        let ratingClass = '';
        let ratingLabel = r.rating || '待评级';
        if (ratingLabel.includes('A')) ratingClass = 'rating-a';
        else if (ratingLabel.includes('B')) ratingClass = 'rating-b';
        else if (ratingLabel.includes('C')) ratingClass = 'rating-c';
        else if (ratingLabel.includes('D')) ratingClass = 'rating-d';
        
        let hasReport = r.report_url && r.report_url.length > 0;
        
        container.innerHTML += '<div class="report-card ' + typeClass + '">';
        container.innerHTML += '<span class="badge ' + typeClass + '">' + typeLabel + '</span>';
        container.innerHTML += '<h3>' + (r.company || '未命名') + '</h3>';
        container.innerHTML += '<div class="meta">📅 ' + (r.report_date || '未知') + '</div>';
        container.innerHTML += '<div class="rating ' + ratingClass + '">' + ratingLabel + '</div>';
        if (hasReport) {
            container.innerHTML += '<a class="btn-view" href="' + r.report_url + '" target="_blank">📄 查看报告</a>';
        } else {
            container.innerHTML += '<div style="font-size:12px;color:#94a3b8;margin-top:8px">⏳ 报告生成中，请稍后再查</div>';
        }
        container.innerHTML += '</div>';
    });
}

// 回车搜索
document.getElementById('phoneInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') searchReport();
});

// 自动trim输入
document.getElementById('phoneInput').addEventListener('input', function(e) {
    this.value = this.value.replace(/\D/g, '');
});
</script>
